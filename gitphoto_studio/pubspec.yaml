name: gitphoto_studio
description: "GitPhoto Studio IA — L'atelier des médias connectés."
publish_to: 'none'
version: 1.0.0+2

environment:
  sdk: ^3.9.0

dependencies:
  crypto: ^3.0.8
  desktop_drop: ^0.8.4
  dio: ^5.11.1
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  go_router: ^18.1.2
  image: ^4.12.0
  intl: ^0.20.3
  mime: ^2.1.0
  path: ^1.9.1
  path_provider: ^2.1.6
  sqlite3: ^3.8.0
  url_launcher: ^6.3.3
  video_player: ^2.14.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/help/
    - assets/help/fr/
    - assets/help/en/
