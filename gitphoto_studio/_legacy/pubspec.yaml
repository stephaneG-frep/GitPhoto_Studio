name: gitphoto_studio
description: GitPhoto Studio IA - Application de gestion de photos avec intelligence artificielle
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI & Theming
  cupertino_icons: ^1.0.2
  flutter_svg: ^2.0.7
  google_fonts: ^6.1.0
  cached_network_image: ^3.3.0
  photo_manager: ^3.0.0
  image_picker: ^1.0.4
  image: ^4.1.3
  flutter_cache_manager: ^3.3.0
  desktop_drop: ^0.4.4
  cross_file: ^0.3.3+8
  
  # State Management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3
  go_router: ^13.0.0
  
  # Storage & Database
  path_provider: ^2.1.1
  shared_preferences: ^2.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  sqlite3_flutter_libs: ^0.5.0
  
  # HTTP & API
  dio: ^5.4.0
  http: ^1.1.0
  
  # AI & Mistral Integration
  # mistral_client: ^0.1.0  # Custom package for Mistral API
  
  # Utils
  uuid: ^4.2.1
  intl: ^0.19.0
  permission_handler: ^11.1.0
  url_launcher: ^6.2.2
  

  
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.8
  riverpod_generator: ^2.3.9
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
