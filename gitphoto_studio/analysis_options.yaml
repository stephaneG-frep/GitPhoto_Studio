include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - _legacy/**
    - build/**
    - lib/l10n/generated/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
  language:
    strict-casts: true
    strict-raw-types: true

linter:
  rules:
    - prefer_single_quotes
    - avoid_print
    - prefer_final_locals
    - require_trailing_commas
